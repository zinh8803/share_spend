<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#1F192F" />
    </filter>
  </defs>
  
  <!-- Outer Badge -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#EDE6FF" stroke="#1F192F" stroke-width="7" />
  
  <!-- Top Photobooth Frame (Lilac/Pink) -->
  <rect x="24" y="20" width="80" height="40" rx="8" fill="#FFD6E2" stroke="#1F192F" stroke-width="5" />
  <!-- Cute smiley face -->
  <circle cx="48" cy="37" r="3.5" fill="#1F192F" />
  <circle cx="80" cy="37" r="3.5" fill="#1F192F" />
  <path d="M56 43 Q64 50 72 43" fill="none" stroke="#1F192F" stroke-width="3.5" stroke-linecap="round" />
  <ellipse cx="40" cy="42" rx="4" ry="2.5" fill="#FF7597" opacity="0.8" />
  <ellipse cx="88" cy="42" rx="4" ry="2.5" fill="#FF7597" opacity="0.8" />
  
  <!-- Bottom Photobooth Frame (Butter Yellow) -->
  <rect x="24" y="68" width="80" height="40" rx="8" fill="#FFF1A8" stroke="#1F192F" stroke-width="5" />
  <!-- Coin symbol representing Spend -->
  <circle cx="64" cy="88" r="13" fill="#FFE066" stroke="#1F192F" stroke-width="4" />
  <!-- Coin currency symbol (d with stroke / VND) -->
  <text x="64" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#1F192F" text-anchor="middle">đ</text>
  
  <!-- Sparkles -->
  <path d="M102 12 Q102 19 109 19 Q102 19 102 26 Q102 19 95 19 Q102 19 102 12 Z" fill="#FF7597" stroke="#1F192F" stroke-width="2" />
  <circle cx="20" cy="22" r="3" fill="#C9B6FF" stroke="#1F192F" stroke-width="2" />
</svg>

